services:
  - type: web
    name: phigrad
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PHIGRAD_ENV
        value: development # Demo only: invitation links are written to service logs when SMTP is unavailable.
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LOCAL_API_TOKEN
        generateValue: true
      - key: UNIPILE_API_KEY
        sync: false
      - key: UNIPILE_API_BASE_URL
        value: https://api.unipile.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: SUPERADMIN_EMAIL
        value: amit.kumar@phigrad.ai
      - key: SUPERADMIN_INITIAL_PASSWORD
        sync: false
